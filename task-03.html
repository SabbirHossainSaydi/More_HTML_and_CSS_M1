<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A sementic table</title>
  <style>
    table {
      width: 100%;
      height: 400px;
    }

    h1,
    p,
    table {
      text-align: center;
    }


    th,
    tr,
    td {
      border: 2px double gray;
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <h1>Table Tennis Tournament</h1>
      <p>Tournament Schedule and Results</p>
      <table>
        <tr>
          <th>Round 1</td>
          <th>Player A</td>
          <th>Player B</td>
        </tr>

        <tr>
          <td>match-1</td>
          <td>John</td>
          <td>Alice</td>
        </tr>
        <tr>
          <td>match-2</td>
          <td>Mark</td>
          <td>Sarah</td>

        </tr>
        <tr>
          <th>Round 2</td>
          <th>Player C</td>
          <th>Player D</td>
        </tr>
        <tr>
          <td>match-3</td>
          <td>TBD</td>
          <td>TBD</td>
        </tr>
        <tr>
          <td>match-4</td>
          <td>TBD</td>
          <td>TBD</td>
        </tr>
        <tr>
          <th>Final</td>
          <th>Winner of Match 3</td>
          <th>Winner of Match</td>
        </tr>
        <tr>
          <td>Champion</td>
          <td>TBD</td>
          <td>TBD</td>

        </tr>

      </table>

    </div>
  </main>
</body>

</html>
