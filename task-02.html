<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A comment section</title>
  <style>
    .container {
      display: block;
      margin-left: 20pxs;
    }


    input,
    textarea,
    select {
      display: block;
      margin-top: 20px;
      margin-bottom: 20px;
      margin-left: 20px;
      border: 2px solid green;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    label {
      margin-left: 20px;
      font-size: larger;
      font-family: 'Times New Roman', Times, serif;

    }

    option {
      background-color: aquamarine;
      text-align: center;



    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <label for="text">Comment</label>
      <textarea name="" id="text" rows="4" cols="40"></textarea>
      <label for="option">Select</label>
      <select name="" id="option">
        <option value="good">Good</option>
        <option value="excellent">Excellent</option>
        <option value="so good">So good</option>
        <option value="">poor</option>
        <option value="very good ">very good</option>
      </select>

      <input type="submit" value="Submit">

    </div>
  </main>
</body>

</html>
